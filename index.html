<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lokeswar Raju Gundlapalli - AI Engineer</title>
    <meta
      name="description"
      content="AI Engineer and ML specialist building real-time voice agents, RAG pipelines, and production ML systems with Python, FastAPI, AWS and Docker."
    />
    <meta name="theme-color" content="#f7f0e3" />

    <!-- Inline SVG favicon: no extra request, no 404 in the console. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- The stylesheet asks for Inter throughout; without this the whole page
         silently falls back to Segoe UI. One variable font covers 400-900,
         which is every weight the CSS uses. swap so text is never invisible
         while it loads. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  </body>
